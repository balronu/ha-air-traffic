name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "homeassistant==2026.10.1" "pytest==9.0.3" "pytest-asyncio==1.4.0" "pytest-homeassistant-custom-component==0.13.372"
      - run: pytest -q
      - run: python -m compileall -q custom_components tests
      - run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts and 'node_modules' not in p.parts]"
      - run: git diff --check -- . ':(exclude)custom_components/air_traffic_merge/frontend/air-traffic-card.js'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/air_traffic_merge/frontend/air-traffic-card.js
      - run: git diff --check -- . ':(exclude)custom_components/air_traffic_merge/frontend/air-traffic-card.js'
